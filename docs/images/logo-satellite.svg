<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060e1c"/>
      <stop offset="0.55" stop-color="#0c2247"/>
      <stop offset="1" stop-color="#081631"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#2f8fe0" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#1a5fa8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="0.45" stop-color="#b3c8e2"/>
      <stop offset="1" stop-color="#6b83a3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.45" stop-color="#c8d6e8"/>
      <stop offset="1" stop-color="#7f95b2"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a9c4"/>
      <stop offset="1" stop-color="#566c8b"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.5" stop-color="#e2a93f"/>
      <stop offset="1" stop-color="#9a6810"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fe0"/>
      <stop offset="0.45" stop-color="#174a92"/>
      <stop offset="1" stop-color="#081f45"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe9f5"/>
      <stop offset="1" stop-color="#7b90ad"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 星空 -->
  <g fill="#cfe6ff">
    <circle cx="118" cy="128" r="2.4" opacity="0.85"/>
    <circle cx="212" cy="86"  r="1.6" opacity="0.55"/>
    <circle cx="305" cy="160" r="2.0" opacity="0.70"/>
    <circle cx="402" cy="96"  r="1.4" opacity="0.50"/>
    <circle cx="520" cy="70"  r="2.2" opacity="0.80"/>
    <circle cx="640" cy="120" r="1.5" opacity="0.55"/>
    <circle cx="742" cy="78"  r="2.6" opacity="0.85"/>
    <circle cx="842" cy="150" r="1.8" opacity="0.60"/>
    <circle cx="918" cy="92"  r="2.0" opacity="0.70"/>
    <circle cx="972" cy="210" r="1.4" opacity="0.50"/>
    <circle cx="86"  cy="262" r="1.7" opacity="0.55"/>
    <circle cx="170" cy="330" r="1.3" opacity="0.45"/>
    <circle cx="880" cy="320" r="1.9" opacity="0.60"/>
    <circle cx="952" cy="400" r="1.5" opacity="0.50"/>
    <circle cx="70"  cy="430" r="1.6" opacity="0.45"/>
    <circle cx="128" cy="540" r="1.4" opacity="0.40"/>
    <circle cx="906" cy="520" r="1.7" opacity="0.50"/>
    <circle cx="976" cy="600" r="1.3" opacity="0.40"/>
    <circle cx="250" cy="250" r="1.2" opacity="0.35"/>
    <circle cx="790" cy="240" r="1.3" opacity="0.40"/>
  </g>

  <!-- 轨道 -->
  <ellipse cx="512" cy="470" rx="548" ry="142" fill="none"
           stroke="#3fa9ff" stroke-opacity="0.18" stroke-width="2.5"
           stroke-dasharray="7 12" transform="rotate(-9 512 470)"/>

  <!-- 卫星背后的柔光 -->
  <circle cx="512" cy="430" r="320" fill="#2f8fe0" opacity="0.10" filter="url(#blur24)"/>

  <!-- 地球 -->
  <g>
    <ellipse cx="512" cy="1038" rx="820" ry="286" fill="url(#earth)"/>
    <ellipse cx="512" cy="1038" rx="820" ry="286" fill="none"
             stroke="#63caff" stroke-opacity="0.55" stroke-width="7" filter="url(#soft4)"/>
    <g fill="#2fa88a" opacity="0.30" filter="url(#soft)">
      <ellipse cx="300" cy="930" rx="150" ry="46"/>
      <ellipse cx="690" cy="900" rx="120" ry="40"/>
      <ellipse cx="540" cy="972" rx="180" ry="50"/>
      <ellipse cx="880" cy="962" rx="90" ry="34"/>
    </g>
    <ellipse cx="512" cy="1000" rx="840" ry="300" fill="#2f9fff" opacity="0.07" filter="url(#blur24)"/>
  </g>

  <!-- 信号波（从天线向下发往地球） -->
  <g fill="none" stroke="#67d4ff" stroke-linecap="round" filter="url(#glowCyan)">
    <path d="M402 560 A110 110 0 0 1 622 560" stroke-width="7" opacity="0.85"/>
    <path d="M337 560 A175 175 0 0 1 687 560" stroke-width="6" opacity="0.50"/>
    <path d="M272 560 A240 240 0 0 1 752 560" stroke-width="5" opacity="0.28"/>
  </g>

  <!-- 卫星 -->
  <g>
    <!-- 左太阳能板 -->
    <g>
      <rect x="150" y="352" width="238" height="148" rx="12" fill="url(#panel)"/>
      <rect x="150" y="352" width="238" height="148" rx="12" fill="none" stroke="#5f7899" stroke-width="3"/>
      <g stroke="#4f6a8c" stroke-opacity="0.55" stroke-width="2">
        <line x1="197" y1="356" x2="197" y2="496"/>
        <line x1="244" y1="356" x2="244" y2="496"/>
        <line x1="291" y1="356" x2="291" y2="496"/>
        <line x1="338" y1="356" x2="338" y2="496"/>
        <line x1="154" y1="401" x2="384" y2="401"/>
        <line x1="154" y1="450" x2="384" y2="450"/>
      </g>
      <line x1="158" y1="360" x2="380" y2="360" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    </g>
    <!-- 右太阳能板 -->
    <g>
      <rect x="636" y="352" width="238" height="148" rx="12" fill="url(#panel)"/>
      <rect x="636" y="352" width="238" height="148" rx="12" fill="none" stroke="#5f7899" stroke-width="3"/>
      <g stroke="#4f6a8c" stroke-opacity="0.55" stroke-width="2">
        <line x1="683" y1="356" x2="683" y2="496"/>
        <line x1="730" y1="356" x2="730" y2="496"/>
        <line x1="777" y1="356" x2="777" y2="496"/>
        <line x1="824" y1="356" x2="824" y2="496"/>
        <line x1="640" y1="401" x2="870" y2="401"/>
        <line x1="640" y1="450" x2="870" y2="450"/>
      </g>
      <line x1="644" y1="360" x2="866" y2="360" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    </g>

    <!-- 连接臂 -->
    <rect x="380" y="416" width="66" height="18" rx="6" fill="url(#arm)"/>
    <rect x="578" y="416" width="66" height="18" rx="6" fill="url(#arm)"/>

    <!-- 顶部天线 -->
    <line x1="512" y1="330" x2="512" y2="262" stroke="#aebfd6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="512" cy="256" r="12" fill="#ffe7ad"/>
    <circle cx="512" cy="256" r="12" fill="#ffe7ad" opacity="0.5" filter="url(#soft4)"/>

    <!-- 主体 -->
    <rect x="437" y="326" width="150" height="206" rx="26" fill="url(#body)"/>
    <path d="M561 326 h26 a26 26 0 0 1 26 26 v154 a26 26 0 0 1 -26 26 h-26 Z" fill="url(#bodySide)" opacity="0.9"/>
    <rect x="437" y="326" width="150" height="206" rx="26" fill="none" stroke="#5f7899" stroke-width="3"/>
    <!-- 主体细节 -->
    <rect x="462" y="356" width="86" height="10" rx="5" fill="#4f6a8c" opacity="0.45"/>
    <rect x="462" y="380" width="60" height="8" rx="4" fill="#4f6a8c" opacity="0.35"/>
    <circle cx="478" cy="486" r="9" fill="#67d4ff"/>
    <circle cx="478" cy="486" r="9" fill="#67d4ff" opacity="0.6" filter="url(#soft4)"/>
    <rect x="500" y="474" width="52" height="12" rx="6" fill="#e2a93f" opacity="0.85"/>
    <!-- 高光 -->
    <line x1="456" y1="340" x2="456" y2="500" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

    <!-- 天线支架 -->
    <rect x="504" y="512" width="16" height="34" rx="7" fill="url(#arm)"/>
    <!-- 抛物面天线（朝下） -->
    <ellipse cx="512" cy="562" rx="94" ry="34" fill="url(#dish)"/>
    <ellipse cx="512" cy="562" rx="94" ry="34" fill="none" stroke="#ffd98a" stroke-width="4"/>
    <ellipse cx="512" cy="558" rx="70" ry="24" fill="#b87d1c" opacity="0.35"/>
    <circle cx="512" cy="520" r="8" fill="#ffe7ad"/>
    <line x1="512" y1="520" x2="512" y2="556" stroke="#c98f24" stroke-width="4"/>
  </g>

  <!-- 边缘暗角 -->
  <rect width="1024" height="1024" fill="none"/>
</svg>
